name: CI

on:
  push:
    branches: [main]
  # Every pull request, including stacked ones whose base is another branch.
  pull_request:
  workflow_dispatch:
  # release.yml runs these same gates on a version tag before publishing.
  workflow_call:

# The gates only read the repository: no token scope beyond that, no secrets.
permissions:
  contents: read

# A newer push to a pull request makes its older run pointless, so pull requests
# share one group per ref and cancel in progress. Every other run (a push to main,
# a manual run, a release calling these gates) gets a group of its own: GitHub
# replaces a pending run in a shared group even without cancel-in-progress, which
# would let a quick second merge drop the first merge commit's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheapest check first: the version labels a release depends on agree.
  release-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: VERSION, package.json and CHANGELOG agree
        run: python tools/release_check.py

  # Pyflakes and syntax errors only; ruff.toml holds the rule set.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: ruff check
        run: |
          python -m pip install ruff==0.16.10
          python -m ruff check .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      # The cross-runtime lock and parity tests start the Node installer too.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r requirements-optional.txt

      - name: Run test suite
        run: python -m pytest -rs --junitxml=test-results.xml

      - name: Enforce named skip budget
        if: always()
        run: python tests/check_skip_budget.py test-results.xml --symlink-budget ${{ runner.os == 'Windows' && 9 || 0 }}

      - name: Installer preflight
        run: python installer/install.py doctor --target generic-agents --json

      - name: Installer dry-run
        run: python installer/install.py install --target generic-agents --dry-run --json

      - name: Build the distribution archive
        run: python installer/distribution.py

  node:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python 3.13 for parity
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Run Node installer tests
        run: npm test

      - name: Inspect npm package contents
        run: npm pack --dry-run --json

      - name: Smoke-test packed CLI in isolation
        run: npm run test:pack-smoke
