name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run test suite
        run: |
          python -m pytest

      - name: Test installer preflight
        run: |
          python installer/install.py doctor --target generic-agents --json

      - name: Test installer dry-run
        run: |
          python installer/install.py install --target generic-agents --dry-run --json

      - name: Test distribution package build
        run: |
          python installer/distribution.py

  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20.x, 22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Python 3.13 for parity
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run Node installer tests
        run: npm test

      - name: Inspect npm package contents
        run: npm pack --dry-run --json

      - name: Smoke-test packed CLI in isolation
        run: npm run test:pack-smoke
